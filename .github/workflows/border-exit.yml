name: 출국 심사

# 국경경비대 출국 심사(border/)의 권위 있는 심사. main으로 가는 PR에서 돈다.
#  - 이 워크플로 파일, 검사기, 비자를 모두 기본 가지(main)의 것으로 쓴다. 올라온 가지가 고칠 수 없다.
#  - 올라온 변경은 git 자료로만 받는다. 꺼내 놓지도, 짓지도, 실행하지도 않는다.
#  - 캐시와 다른 작업의 산출물을 받지 않는다. 토큰 권한도 비밀값도 쓰지 않는다.
#  - 다른 사람이 만든 액션을 쓰지 않는다(git과 cargo만).
# dev 푸시에서 도는 참고용 심사는 border-preview.yml에 따로 있다(검사 이름이 겹치지 않게 나눴다).
#
# 한계: GitHub의 "필수 검사"는 이름으로 맞춘다. 올라온 가지가 같은 이름의 검사를 내는 워크플로를
# 새로 넣으면 이름만으로는 구별되지 않는다. 그래서 워크플로 파일의 변경은 이 심사가 언제나
# "사람이 볼 것"으로 올리고, 합치는 것은 사람이 요약을 읽고 누른다.
on:
  pull_request_target:
    branches: [main]

permissions: {}

concurrency:
  group: border-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  exit:
    name: 출국 심사 (권위 있음)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 기준점(main) 받기
        run: git clone --quiet --branch main "https://github.com/${GITHUB_REPOSITORY}.git" base

      - name: 검사기 짓기 (기준점의 소스)
        run: cargo build --release --locked --manifest-path base/border/Cargo.toml

      - name: 올라온 변경 받기 (자료로만)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "PR 번호가 올바르지 않습니다"; exit 3;; esac
          git -C base fetch --quiet origin "refs/pull/${PR}/head"
          git -C base rev-parse FETCH_HEAD > head.txt

      - name: 심사
        run: |
          set -uo pipefail
          head="$(cat head.txt)"
          # GitHub의 셸은 명령이 0이 아닌 값으로 끝나면 그 자리에서 멈춘다. 값을 받아서 아래에서 가른다.
          code=0
          base/border/target/release/border exit --repo base --base main --head "$head" --out report.md || code=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          case "$code" in
            0) exit 0 ;;
            1) echo "::warning title=출국 심사::사람 확인 필요 — 합치기 전에 이 실행의 요약을 읽으세요"; exit 0 ;;
            2) echo "::error title=출국 심사::비자 밖의 변경이 있습니다"; exit 1 ;;
            *) echo "::error title=출국 심사::검사하지 못했습니다. 통과로 치지 않습니다"; exit 1 ;;
          esac
