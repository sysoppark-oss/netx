name: 출국 심사

# 국경경비대 출국 심사(border/)를 돌려, 올라온 변경을 비자 · 신고 · 실제 변경으로 맞춰 본다.
#
# 두 가지로 돈다.
#  1) main으로 가는 PR (pull_request_target): 권위 있는 심사.
#     - 이 워크플로 파일, 검사기, 비자를 모두 기본 가지(main)의 것으로 쓴다. 올라온 가지가 고칠 수 없다.
#     - 올라온 변경은 git 자료로만 받는다. 꺼내 놓지도, 짓지도, 실행하지도 않는다.
#     - 캐시와 다른 작업의 산출물을 받지 않는다. 토큰 권한도 비밀값도 쓰지 않는다.
#  2) dev에 푸시 (push): 참고용 심사. dev의 검사기로 돌므로 권위가 없다. 실패로 표시하지 않는다.
#
# 다른 사람이 만든 액션을 쓰지 않는다(git과 cargo만).
on:
  pull_request_target:
    branches: [main]
  push:
    branches: [dev]

permissions: {}

concurrency:
  group: border-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exit:
    name: 출국 심사 (권위 있음)
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 기준점(main) 받기
        run: git clone --quiet --branch main "https://github.com/${GITHUB_REPOSITORY}.git" base

      - name: 검사기 짓기 (기준점의 소스)
        run: cargo build --release --locked --manifest-path base/border/Cargo.toml

      - name: 올라온 변경 받기 (자료로만)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo "PR 번호가 올바르지 않습니다"; exit 3;; esac
          git -C base fetch --quiet origin "refs/pull/${PR}/head"
          git -C base rev-parse FETCH_HEAD > head.txt

      - name: 심사
        run: |
          set -uo pipefail
          head="$(cat head.txt)"
          base/border/target/release/border exit --repo base --base main --head "$head" --out report.md
          code=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          case "$code" in
            0) exit 0 ;;
            1) echo "::warning title=출국 심사::사람 확인 필요 — 합치기 전에 이 실행의 요약을 읽으세요"; exit 0 ;;
            2) echo "::error title=출국 심사::비자 밖의 변경이 있습니다"; exit 1 ;;
            *) echo "::error title=출국 심사::검사하지 못했습니다. 통과로 치지 않습니다"; exit 1 ;;
          esac

  preview:
    name: 출국 심사 (참고용)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        run: |
          set -euo pipefail
          git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo checkout --quiet --detach "$GITHUB_SHA"

      - name: 검사기 짓기와 시험
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path repo/border/Cargo.toml
          cargo build --release --locked --manifest-path repo/border/Cargo.toml

      - name: 심사
        run: |
          set -uo pipefail
          {
            echo "> 참고용입니다. dev의 검사기로 돌았습니다. 권위 있는 심사는 main으로 가는 PR에서 돕니다."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if git -C repo cat-file -e "origin/main:.border/visa.toml" 2>/dev/null; then
            repo/border/target/release/border exit --repo repo --base origin/main --head "$GITHUB_SHA" --out report.md
          else
            repo/border/target/release/border exit --repo repo --base origin/main --head "$GITHUB_SHA" --visa repo/.border/visa.toml --out report.md
          fi
          echo "끝날 때의 값: $?"
          cat report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit 0
