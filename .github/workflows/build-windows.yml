name: Windows 빌드

# main, dev에 푸시하거나 PR을 열 때마다 Windows 설치 파일을 만든다.
# 결과물은 Actions 실행 화면의 Artifacts에서 내려받는다.
# dev 브랜치 빌드는 노트북에 먼저 설치해 확인할 수 있도록 `dev-builds` 브랜치에도 올린다
# (스토리방화벽 개발판과 같은 방식: 커밋 하나짜리 고아 브랜치를 덮어쓴다).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 프론트엔드 의존성 설치
        run: npm ci

      - name: 백엔드 단위 테스트
        working-directory: src-tauri
        run: cargo test --locked

      - name: 설치 파일 빌드
        run: npm run tauri build

      - name: 설치 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: NetX-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: 시험판을 dev-builds 브랜치에 게시
        if: github.event_name == 'push' && github.ref_name == 'dev'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          $d = Join-Path $env:RUNNER_TEMP "devbuilds"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item $setup.FullName (Join-Path $d "NetX-dev-setup.exe")
          $sha = (Get-FileHash (Join-Path $d "NetX-dev-setup.exe") -Algorithm SHA256).Hash.ToLower()
          @("commit=$env:GITHUB_SHA", "setup_sha256=$sha", "built=$((Get-Date).ToUniversalTime().ToString('s'))Z") | Set-Content (Join-Path $d "manifest.txt") -Encoding ascii
          git -C $d init -q
          git -C $d checkout -q --orphan dev-builds
          git -C $d add -A
          git -C $d -c user.name="devbuild" -c user.email="devbuild@users.noreply.github.com" commit -q -m "dev build $env:GITHUB_SHA"
          $url = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git -C $d push -q -f $url dev-builds
          Get-Content (Join-Path $d "manifest.txt")
